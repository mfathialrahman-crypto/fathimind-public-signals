name: Public Signals Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required files
        run: |
          echo "Validating public signals surface..."
          test -f README.md || exit 1
          test -f STATUS.md || exit 1
          test -f AGENTS.md || exit 1
          test -f LICENSE || exit 1
          echo "All required files present."

      - name: Check STATUS has current version reference
        run: |
          if ! grep -q "2.1.42-pro" STATUS.md; then
            echo "ERROR: STATUS.md missing current Core Pro version"
            exit 1
          fi
          echo "STATUS version reference OK."
